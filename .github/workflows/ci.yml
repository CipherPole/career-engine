name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Lint & Data Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate All JSON Files
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dataDir = path.join(process.cwd(), 'data');
          const files = fs.readdirSync(dataDir).filter(f => f.endsWith('.json'));
          let failed = false;
          files.forEach(f => {
            try {
              const content = fs.readFileSync(path.join(dataDir, f), 'utf8');
              JSON.parse(content);
              console.log('✓ Valid JSON:', f);
            } catch (err) {
              console.error('✗ Invalid JSON:', f, err.message);
              failed = true;
            }
          });
          if (failed) process.exit(1);
          "

      - name: Verify Web Application Assets
        run: |
          test -f index.html || exit 1
          test -f styles/main.css || exit 1
          test -f scripts/app.js || exit 1
          test -f scripts/training-engine.js || exit 1
          test -f scripts/cert-engine.js || exit 1
          echo "✓ All core frontend assets verified."

      - name: CI Build & Smoke Test Complete
        run: |
          echo "✅ Career Engine CI pipeline completed successfully."
